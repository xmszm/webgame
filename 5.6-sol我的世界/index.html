<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#6eb1d6" />
    <meta name="description" content="5.6-sol我的世界：第一人称方块沙盒建造游戏。" />
    <title>5.6-sol我的世界</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="5.6-sol我的世界三维游戏画面"></canvas>

      <section id="start-screen" class="screen screen--start" aria-labelledby="game-title">
        <div class="brand-lockup">
          <p class="edition">方块世界 · 建造版</p>
          <h1 id="game-title"><span>5.6-sol</span>我的世界</h1>
          <p id="world-summary" class="world-summary">正在生成世界...</p>
          <div class="menu-actions">
            <button id="play-button" class="command command--primary" type="button">
              <i data-lucide="play" aria-hidden="true"></i>
              进入世界
            </button>
            <button id="new-world-button" class="command command--secondary" type="button">
              <i data-lucide="refresh-cw" aria-hidden="true"></i>
              新世界
            </button>
          </div>
        </div>
        <p class="version">SOL-56 · 创造模式</p>
      </section>

      <section id="hud" class="hud" aria-label="游戏状态" hidden>
        <div class="hud-top">
          <div class="world-chip">
            <strong>5.6-sol我的世界</strong>
            <span id="position-readout" class="tabular">X 00 · Y 00 · Z 00</span>
          </div>
          <div class="hud-tools">
            <button id="sound-button" class="icon-button" type="button" aria-label="关闭声音" title="声音">
              <i data-lucide="volume-2" aria-hidden="true"></i>
            </button>
            <button id="pause-button" class="icon-button" type="button" aria-label="暂停游戏" title="暂停">
              <i data-lucide="pause" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div id="crosshair" class="crosshair" aria-hidden="true"></div>
        <div id="target-label" class="target-label" aria-live="polite"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <div class="player-status" aria-label="玩家生命与行动状态">
          <div class="hearts" aria-label="生命值 10">
            <i data-lucide="heart" aria-hidden="true"></i><i data-lucide="heart" aria-hidden="true"></i>
            <i data-lucide="heart" aria-hidden="true"></i><i data-lucide="heart" aria-hidden="true"></i>
            <i data-lucide="heart" aria-hidden="true"></i>
          </div>
        </div>

        <nav id="hotbar" class="hotbar" aria-label="方块快捷栏"></nav>

        <div id="touch-controls" class="touch-controls" aria-label="移动端游戏控制">
          <div id="joystick" class="joystick" aria-label="移动摇杆"><span id="joystick-knob"></span></div>
          <div class="touch-actions">
            <button id="jump-button" class="touch-button" type="button" aria-label="跳跃">
              <i data-lucide="arrow-up" aria-hidden="true"></i>
            </button>
            <button id="break-button" class="touch-button" type="button" aria-label="采掘方块">
              <i data-lucide="pickaxe" aria-hidden="true"></i>
            </button>
            <button id="place-button" class="touch-button" type="button" aria-label="放置方块">
              <i data-lucide="box" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </section>

      <dialog id="pause-dialog" class="game-dialog" aria-labelledby="pause-title">
        <div class="dialog-heading">
          <span class="dialog-mark"><i data-lucide="box" aria-hidden="true"></i></span>
          <div>
            <p>世界已保存</p>
            <h2 id="pause-title">游戏暂停</h2>
          </div>
        </div>
        <div class="dialog-actions">
          <button id="resume-button" class="command command--primary" type="button">
            <i data-lucide="play" aria-hidden="true"></i>继续游戏
          </button>
          <button id="pause-new-world-button" class="command command--secondary" type="button">
            <i data-lucide="refresh-cw" aria-hidden="true"></i>重建世界
          </button>
          <button id="exit-button" class="command command--quiet" type="button">
            <i data-lucide="log-out" aria-hidden="true"></i>保存并退出
          </button>
        </div>
      </dialog>

      <dialog id="reset-dialog" class="game-dialog game-dialog--confirm" aria-labelledby="reset-title">
        <div class="dialog-heading">
          <span class="dialog-mark dialog-mark--danger"><i data-lucide="triangle-alert" aria-hidden="true"></i></span>
          <div>
            <p>当前建造将被清除</p>
            <h2 id="reset-title">创建新世界？</h2>
          </div>
        </div>
        <div class="dialog-actions dialog-actions--row">
          <button id="cancel-reset-button" class="command command--quiet" type="button">取消</button>
          <button id="confirm-reset-button" class="command command--danger" type="button">创建</button>
        </div>
      </dialog>

      <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
