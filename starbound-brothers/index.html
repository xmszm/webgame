<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#75c8f4" />
    <meta name="description" content="星跃兄弟，原创超级马里奥式横版平台闯关游戏。" />
    <title>星跃兄弟：横版闯关</title>
  </head>
  <body>
    <main id="app">
      <div id="game-stage" aria-hidden="true"></div>

      <section id="menu-screen" class="screen menu-screen" aria-labelledby="game-title">
        <a class="home-link" href="../" aria-label="返回 WebGame 游戏列表"><i data-lucide="arrow-left" aria-hidden="true"></i><span>游戏列表</span></a>
        <div class="menu-content">
          <p class="kicker">ORIGINAL PLATFORM ADVENTURE</p>
          <h1 id="game-title"><span>星跃</span>兄弟</h1>
          <p class="tagline">原创超级马里奥式横版冒险</p>

          <div class="level-select" role="group" aria-label="选择关卡">
            <div class="level-heading"><span>冒险地图</span><strong id="unlock-copy">1 / 3</strong></div>
            <div id="level-list" class="level-list"></div>
          </div>

          <button id="start-button" class="primary-command" type="button"><i data-lucide="play" aria-hidden="true"></i><span>开始冒险</span></button>
        </div>
      </section>

      <section id="hud" class="hud" aria-label="游戏状态" hidden>
        <a class="hud-home" href="../" aria-label="返回游戏列表"><i data-lucide="arrow-left" aria-hidden="true"></i></a>
        <div class="hud-stat"><span>分数</span><strong id="score-value">000000</strong></div>
        <div class="hud-stat"><span>星币</span><strong id="coin-value">00</strong></div>
        <div class="hud-level"><span id="level-name">青草启程</span><div class="progress-track" aria-hidden="true"><span id="run-progress"></span></div></div>
        <div class="hud-stat"><span>生命</span><strong id="lives-value">3</strong></div>
        <div class="hud-stat"><span>时间</span><strong id="time-value">105</strong></div>
        <div class="hud-actions">
          <button id="sound-button" class="icon-button" type="button" aria-label="关闭声音" title="声音"><i data-lucide="volume-2" aria-hidden="true"></i></button>
          <button id="pause-button" class="icon-button" type="button" aria-label="暂停游戏" title="暂停"><i data-lucide="pause" aria-hidden="true"></i></button>
        </div>
      </section>

      <div id="touch-controls" class="touch-controls" aria-label="触控操作" hidden>
        <div class="move-controls">
          <button type="button" class="touch-button" data-control="left" aria-label="向左移动"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <button type="button" class="touch-button" data-control="right" aria-label="向右移动"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>
        <button type="button" class="touch-button jump-button" data-control="jump" aria-label="跳跃"><i data-lucide="arrow-up" aria-hidden="true"></i></button>
      </div>

      <dialog id="pause-dialog" class="game-dialog" aria-labelledby="pause-title">
        <p class="dialog-kicker">旅途暂歇</p>
        <h2 id="pause-title">游戏暂停</h2>
        <div class="dialog-actions">
          <button id="resume-button" class="primary-command" type="button"><i data-lucide="play" aria-hidden="true"></i>继续</button>
          <button id="restart-button" class="secondary-command" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i>重新开始</button>
          <button id="exit-button" class="quiet-command" type="button"><i data-lucide="log-out" aria-hidden="true"></i>返回地图</button>
        </div>
      </dialog>

      <dialog id="result-dialog" class="game-dialog result-dialog" aria-labelledby="result-title">
        <p id="result-kicker" class="dialog-kicker">关卡完成</p>
        <div id="result-emblem" class="result-emblem" aria-hidden="true"><i data-lucide="star"></i></div>
        <h2 id="result-title">旗帜升起</h2>
        <div class="result-stats">
          <div><span>总分</span><strong id="result-score">0</strong></div>
          <div><span>星币</span><strong id="result-coins">0</strong></div>
          <div><span>击败</span><strong id="result-enemies">0</strong></div>
        </div>
        <div class="dialog-actions">
          <button id="next-button" class="primary-command" type="button"><i data-lucide="chevron-right" aria-hidden="true"></i><span>下一关</span></button>
          <button id="result-restart-button" class="secondary-command" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i>再试一次</button>
          <button id="result-exit-button" class="quiet-command" type="button">返回地图</button>
        </div>
      </dialog>

      <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
